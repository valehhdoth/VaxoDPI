plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'xyz.valeh.vaxodpi'
    compileSdk 35
    ndkVersion '27.2.12479018'

    def ksPath = System.getenv('KEYSTORE_PATH')
    signingConfigs {
        release {
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (ksPath) { signingConfig signingConfigs.release }
        }
    }
    lint { checkReleaseBuilds false }

    defaultConfig {
        applicationId 'xyz.valeh.vaxodpi'
        minSdk 21
        targetSdk 34
        versionCode Integer.parseInt(providers.environmentVariable('GITHUB_RUN_NUMBER').orElse('2').get())
        versionName '1.2'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
}

tasks.register('runNdkBuild', Exec) {
    group = 'build'

    def ndkDir = android.ndkDirectory
    executable = new File(ndkDir, 'ndk-build').absolutePath

    args(
        'NDK_PROJECT_PATH=build/intermediates/ndkBuild',
        'NDK_LIBS_OUT=src/main/jniLibs',
        'APP_BUILD_SCRIPT=src/main/jni/Android.mk',
        'NDK_APPLICATION_MK=src/main/jni/Application.mk'
    )
}

tasks.named('preBuild').configure {
    dependsOn 'runNdkBuild'
}
